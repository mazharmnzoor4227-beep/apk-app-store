<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments · APK App Store</title><style>:root{color-scheme:dark;--bg:#080a0f;--p:#11141c;--p2:#171b25;--t:#f5f7fb;--m:#a5acba;--l:#293041;--a:#7180ff;--b:#9b6cff;--g:#7fe0a0;--r:#ff8585}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1a1e44,transparent 30%),var(--bg);color:var(--t);font:14px system-ui}header{padding:22px;position:sticky;top:0;background:#080a0fee;border-bottom:1px solid var(--l);z-index:3}h1,h2{margin:0}header p,.muted{color:var(--m)}main{max-width:1100px;margin:auto;padding:18px;display:grid;grid-template-columns:.8fr 1.2fr;gap:16px}@media(max-width:800px){main{grid-template-columns:1fr}}.card{background:linear-gradient(#121620,#0e1118);border:1px solid var(--l);border-radius:22px;padding:18px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}input,select,textarea{width:100%;padding:11px 12px;border-radius:13px;border:1px solid #303747;background:#0a0d13;color:#fff;margin-top:5px}label{font-size:12px;color:var(--m);display:block;margin-top:10px}button,a.btn{border:0;border-radius:13px;padding:11px 14px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700;text-decoration:none;cursor:pointer}button.secondary,a.secondary{background:#1c2230;border:1px solid #303849}.item{border:1px solid var(--l);border-radius:16px;padding:13px;margin-top:10px;background:#0d1017}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;background:#232a3c}.pending{color:#ffd27d}.approved{color:var(--g)}.rejected,.refunded{color:var(--r)}.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}.status{white-space:pre-wrap;color:var(--m);margin-top:10px}</style></head><body><header><div class="row"><div><h1>Payments</h1><p>Manage local payment accounts and approve paid app purchases.</p></div><a class="btn secondary" href="/admin">Apps</a></div></header><main><section class="card"><h2>Payment method</h2><label>ADMIN_KEY<input id="key" type="password" placeholder="Admin secret"></label><div class="row"><div><label>Type<select id="type"><option value="easypaisa">Easypaisa</option><option value="jazzcash">JazzCash</option><option value="nayapay">NayaPay</option><option value="raast">Raast</option><option value="bank">Bank</option><option value="other">Other</option></select></label></div><div><label>Display name<input id="label" placeholder="Easypaisa"></label></div></div><label>Account title<input id="title" placeholder="Account holder name"></label><label>Number / IBAN / Raast ID<input id="value" placeholder="03xx... or PK...IBAN"></label><label>Instructions<textarea id="instructions" placeholder="Send exact amount and enter transaction ID in the app."></textarea></label><label><input id="enabled" type="checkbox" checked style="width:auto"> Enabled</label><div class="actions"><button id="save">Save payment method</button><button class="secondary" id="refresh">Refresh</button></div><div id="msg" class="status"></div><h2 style="margin-top:24px">Configured methods</h2><div id="methods"></div></section><section class="card"><div class="row"><h2>Purchases</h2><button class="secondary" id="refreshPurchases">Refresh</button></div><p class="muted">Approving a purchase unlocks that paid app and its future updates for the same customer installation.</p><div id="purchases"></div></section></main><script>const $=id=>document.getElementById(id);$('key').value=sessionStorage.getItem('adminKey')||'';const key=()=>$('key').value.trim();$('key').onchange=()=>sessionStorage.setItem('adminKey',key());async function api(path,opts={}){opts.headers={...(opts.headers||{}),'x-admin-key':key()};const r=await fetch(path,opts);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadMethods(){try{const d=await api('/api/admin/payment-methods');$('methods').innerHTML=(d.methods||[]).map(m=>`<div class="item"><b>${esc(m.label)}</b> <span class="badge">${esc(m.type)}</span><div class="muted">${esc(m.account_title)} · ${esc(m.account_value)}</div><div class="muted">${esc(m.instructions)}</div></div>`).join('')||'<p class="muted">No methods yet.</p>'}catch(e){$('msg').textContent=e.message}}$('save').onclick=async()=>{try{await api('/api/admin/payment-methods',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:$('type').value,label:$('label').value,account_title:$('title').value,account_value:$('value').value,instructions:$('instructions').value,enabled:$('enabled').checked})});$('msg').textContent='Payment method saved.';loadMethods()}catch(e){$('msg').textContent=e.message}};$('refresh').onclick=loadMethods;async function setStatus(id,status){await api('/api/admin/purchases/'+id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({status})});loadPurchases()}async function loadPurchases(){try{const d=await api('/api/admin/purchases');$('purchases').innerHTML=(d.purchases||[]).map(p=>`<div class="item"><div><b>${esc(p.app_name)}</b> · PKR ${p.amount_pkr} <span class="badge ${esc(p.status)}">${esc(p.status)}</span></div><div class="muted">${esc(p.customer_name)} · ${esc(p.phone)}</div><div>Via ${esc(p.payment_method_label)} · Tx: <b>${esc(p.transaction_reference)}</b></div><div class="muted">${esc(p.created_at)}</div><div class="actions"><button onclick="setStatus(${p.id},'approved')">Approve</button><button class="secondary" onclick="setStatus(${p.id},'rejected')">Reject</button><button class="secondary" onclick="setStatus(${p.id},'refunded')">Refunded</button></div></div>`).join('')||'<p class="muted">No purchases yet.</p>'}catch(e){$('purchases').innerHTML='<p class="rejected">'+esc(e.message)+'</p>'}}$('refreshPurchases').onclick=loadPurchases;loadMethods();loadPurchases();</script></body></html>
