name: Publish APK App Store to Catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-apk-app-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: mazharmnzoor4227-beep/apk-app-store/.github/actions/publish-built-apks@main
        with:
          github-token: ${{ github.token }}
          source-sha: ${{ github.sha }}
          wait-seconds: '900'
