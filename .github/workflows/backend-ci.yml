name: Backend CI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'public/**'
      - 'migrations/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/backend-ci.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist-worker
