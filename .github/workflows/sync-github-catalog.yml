name: Sync GitHub APK Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync_github_catalog.py'
      - '.github/workflows/sync-github-catalog.yml'
      - '.github/actions/publish-built-apks/**'

permissions:
  contents: write

concurrency:
  group: github-apk-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build catalog from public GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_OWNER: mazharmnzoor4227-beep
        run: python scripts/sync_github_catalog.py

      - name: Commit catalog when it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/catalog.json; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          git commit -m "chore(catalog): sync GitHub APK releases"
          git push
